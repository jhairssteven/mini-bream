# ZED-F9P moving-base (primary / correction source).
# Physical link: base UART2 TX -> rover UART1 RX.
# RTCM MSM4 output on UART2 stays in u-center (driver tmode3=0 does not push
# rtcm.ids to the receiver). Host link: USB (/dev/ttyACM0).
#
# config_on_startup=true applies YAML settings to receiver RAM each launch.
# save_on_shutdown=false ensures nothing is written to flash.
ublox_gps_base:
  ros__parameters:
    debug: 1 # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: gps_base

    config_on_startup: true
    save_on_shutdown: false
    clear_bbr: false

    # Same rate on base and rover (required for moving-base RTK).
    rate: 8.0
    nav_rate: 1

    dynamic_model: portable
    fix_mode: auto

    # Moving base: survey-in / fixed mode disabled.
    tmode3: 0

    # USB to host: UBX only (keep config channel, disable NMEA/RTCM on USB).
    # PROTO_UBX=1, PROTO_NMEA=2, PROTO_RTCM3=32
    usb.in: 1
    usb.out: 1

    uart1:
      baudrate: 460800
      in: 1
      out: 1

    # rtcm config is still needed with u-center, since the driver does not push the rtcm.ids to the receiver when in tmode3=0.
    # below is for documentation purposes.
    # Reference for u-center UART2 RTCM (MSM4 moving-base, HPG >= 1.13).
    rtcm:
      ids: [254, 74, 84, 94, 124, 230]  # 4072.0, 1074, 1084, 1094, 1124, 1230
      rates: [1, 1, 1, 1, 1, 1]

    inf:
      all: false
      error: true
      warning: true

    publish:
      all: false
      nmea: false
      nav:
        all: false
        pvt: true
