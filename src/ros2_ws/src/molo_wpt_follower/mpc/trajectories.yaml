# MPC robustness benchmark suite (open-water Gazebo, target XTE RMSE < 0.1 m)
target_rmse_m: 0.1
warmup_s: 20.0
evaluate_s: 60.0
skip_initial_s: 15.0

trajectories:
  - name: lemniscate
    trajectory: {type: lemniscate, scale_m: 7.0, num_points: 32}
    path: {closed: true, monotonic_progress: false, cruise_speed_mps: 0.34}
    ilos: {no_of_laps: 50}

  - name: circle
    trajectory: {type: circle, radius_m: 5.0, num_points: 48}
    path: {closed: true, monotonic_progress: false, cruise_speed_mps: 0.34}
    ilos: {no_of_laps: 50}

  - name: rectangle
    trajectory: {type: rectangle, width_m: 8.0, height_m: 5.5, n_per_edge: 6}
    path: {closed: true, monotonic_progress: false, cruise_speed_mps: 0.32}
    ilos: {no_of_laps: 50}

  - name: triangle
    trajectory: {type: triangle, size_m: 9.0}
    path: {closed: true, monotonic_progress: false, cruise_speed_mps: 0.32}
    ilos: {no_of_laps: 50}

  - name: line_east
    trajectory: {type: line, length_m: 35.0, num_points: 2}
    path: {closed: false, monotonic_progress: true, cruise_speed_mps: 0.36}

  - name: sine
    trajectory: {type: sine, length_m: 40.0, amplitude_m: 5.0, waves: 2.0, num_points: 64}
    path: {closed: false, monotonic_progress: true, cruise_speed_mps: 0.34}
