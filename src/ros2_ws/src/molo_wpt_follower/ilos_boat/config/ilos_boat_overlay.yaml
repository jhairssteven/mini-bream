# ILOS experiment overlay for real BlueBoat (frontseat).
platform:
  name: real_boat
  profile: real
  prerequisites: frontseat

sim_enable: false

feedback:
  use_ground_truth_pose: false

origin:
  lat: null
  lon: null

topics:
  gps: /wamv/sensors/gps/gps/fix
  imu: /wamv/sensors/imu/imu/data
  odometry: /molo_boat/estimated_odometry
  left_thrust: /molo_boat/thrust_left
  right_thrust: /molo_boat/thrust_right

boat_bridge:
  velocity_odom_enabled: true
  thrust_bridge_enabled: true
  gps_topic: /wamv/sensors/gps/gps/fix
  imu_topic: /wamv/sensors/imu/imu/data
  estimated_odom_topic: /molo_boat/estimated_odometry
  velocity_window_s: 0.4
  thrust_input_left: /molo_boat/thrust_left
  thrust_input_right: /molo_boat/thrust_right
  thrust_mode: pwm_topics
  pwm_left: /pwm/left_thrust_cmd
  pwm_right: /pwm/right_thrust_cmd
  pwm_daemon_host: 127.0.0.1
  pwm_daemon_port: 5600

viz:
  pose_topic: /molo_mpc/vehicle_pose
  recent_poses_topic: /molo_h0/recent_poses
  frame_id: world
  max_recent_poses: 40

experiment:
  warmup_s: 20.0
  evaluate_s: 55.0
  skip_initial_s: 20.0
  target_rmse_m: 0.1
  wait_for_gps_timeout_s: 60.0
  wait_for_xte_timeout_s: 45.0
