# Ground-speed kinematic MPC → ILOS → PI/PD → allocation (lemniscate mission).
experiment_id: GS_MPC_ILOS

platform:
  name: template
  profile: base

frame_id: world
control_rate_hz: 10.0

control:
  approach: gs_mpc_ilos

waypoints:
  relative_to_start: true
  trajectory:
    type: lemniscate
    scale_m: 7.0
    num_points: 64

path:
  resample_step_m: 0.396
  cruise_speed_mps: 0.30
  closed: true
  smooth_dubins: true
  monotonic_progress: false

dubins:
  turning_radius_m: 5.71
  step_size_m: 1.25

# Local ground-speed MPC (path generator — does not command thrusters)
gs_mpc:
  horizon: 12
  dt: 0.15
  period_s: 0.10          # replan at the 10 Hz inner-loop rate (solve ~0.05 s)
  u_min: 0.15
  u_max: 1.8
  r_max: 0.45
  du_max: 0.05
  dr_max: 0.12
  ref_ahead_points: 48
  w_path: 50.0
  w_u: 12.0          # keep U near cruise (avoid collapse to u_min)
  w_r: 1.5
  w_du: 2.0
  w_dr: 1.0
  w_obs: 80.0
  boat_radius_m: 0.6
  margin_m: 0.8
  max_iter: 35

# Local ILOS on MPC polyline (pipeline.tex §4)
ilos:
  delta_m: 1.8
  sigma: 0.06
  e_i_limit: 2.5
  advance_eps_m: 0.15

# Inner loops → body force / moment
# Plant (BlueBoat / Gazebo T200): ~100 N/thruster, hydro X≈25U+40U².
# Full surge X_max=2*T_max=200 N → U_ss≈1.95 m/s (matches open-loop 100+100 N).
# k_ff ≈ X/U = 25+40U (~35 N·s/m near 0.3 m/s cruise).
surge_pi:
  kp: 40.0
  ki: 8.0
  k_ff: 35.0
  x_min: -200.0
  x_max: 200.0
  i_limit: 60.0
  dx_max: 200.0                # ~1 s to full surge; scale with x_max
  u_lpf_tau_s: 0.25
  ff_overspeed_fade_mps: 0.40  # wider fade → gentler brake onset
  brake_x_min: -10.0           # light brake floor while U_d>0 (avoid slam reverse)
  brake_kp_scale: 0.4          # weaker P when overspeed
  speed_feedback: body_u

yaw_pd:
  # Plant yaw damping ≈80 N·m·s/rad → need large N for useful r (r≈N/80).
  # Pair with surge_priority_x_min≥40 so cruise can use reverse thruster for yaw.
  kp: 35.0
  kd: 12.0
  n_max: 50.0                  # soft; diamond max ≈ B*T_max ≈ 59 N·m


allocation:
  thruster_sep_m: 0.59
  t_max: 100.0                 # Gazebo / T200 max_thrust_cmd
  t_min: -100.0
  surge_priority: true   # never reverse a thruster against surge intent
  # Arm only under hard surge. Cruise X≈8–12 N; a low threshold (1.5–5)
  # zeros one thruster via |N|≤B/2|X| and kills heading tracking.
  surge_priority_x_min: 40.0

# Sim publishes allocated Newtons directly to Gazebo. Real boat uses f^{-1}
# (n_db / c1) → normalized [-1,1] for motor_controller. c1=T_max so |n|=1 ↔ 100 N.
thruster_map:
  t_max: 100.0
  n_db: 0.02
  c1: 100.0
  c2: 0.0

speed:
  angle_threshold_fast_rad: 0.15
  angle_threshold_slow_rad: 0.60
  min_speed_scale: 0.40
  u_d_floor_frac_of_cruise: 0.75

topics:
  ref_path: /molo_mpc/ref_path
  pred_path: /molo_mpc/pred_path
  traversed_path: /molo_mpc/traversed_path
  vehicle_pose: /molo_mpc/vehicle_pose
  cross_track_error: /molo_mpc/cross_track_error

experiment:
  warmup_s: 5.0
  # ~37 m lemniscate × 80% ≈ 29 m; at ~0.3 m/s needs ≥100 s (not 60).
  evaluate_s: 120.0
  skip_initial_s: 5.0
  target_rmse_m: 0.1
  min_completion: 0.8
  wait_for_gps_timeout_s: 30.0
  wait_for_xte_timeout_s: 30.0
