# Plant-matched smoke seed (T_max=100 N, X_max=200 N).
# Modest yaw (old-regime) + FF near hydro X/U. Validate before BO.
path:
  cruise_speed_mps: 0.30
  closed: true
  smooth_dubins: true
  monotonic_progress: false
surge_pi:
  kp: 40.0
  ki: 6.0
  k_ff: 35.0
  x_min: -200.0
  x_max: 200.0
  i_limit: 60.0
  dx_max: 150.0
  u_lpf_tau_s: 0.30
  ff_overspeed_fade_mps: 0.40
  brake_x_min: -10.0
  brake_kp_scale: 0.4
  speed_feedback: body_u
yaw_pd:
  # Hydro yaw damping nR≈80 → r_ss≈N/80. Need N~40 for ~0.5 rad/s.
  kp: 35.0
  kd: 12.0
  n_max: 50.0
allocation:
  thruster_sep_m: 0.59
  t_max: 100.0
  t_min: -100.0
  # Only arm at hard accel/brake. At cruise X≈8–12 N, x_min=5 zeroed a thruster
  # and heading error stayed ~100 deg (path fail after Newton-correct thrust).
  surge_priority: true
  surge_priority_x_min: 40.0
thruster_map:
  t_max: 100.0
  n_db: 0.02
  c1: 100.0
  c2: 0.0
speed:
  angle_threshold_fast_rad: 0.15
  angle_threshold_slow_rad: 0.60
  min_speed_scale: 0.40
  u_d_floor_frac_of_cruise: 0.75
ilos:
  delta_m: 1.8
  sigma: 0.06
  e_i_limit: 2.5
  advance_eps_m: 0.15
gs_mpc:
  horizon: 12
  dt: 0.15
  period_s: 0.10
  u_min: 0.15
  u_max: 0.45
  r_max: 0.45
  du_max: 0.05
  dr_max: 0.12
  ref_ahead_points: 48
  w_path: 50.0
  w_u: 12.0
  w_r: 1.5
  w_du: 2.0
  w_dr: 1.0
  w_obs: 80.0
  boat_radius_m: 0.6
  margin_m: 0.8
  max_iter: 35
experiment:
  warmup_s: 5.0
  evaluate_s: 120.0
  skip_initial_s: 5.0
  target_rmse_m: 0.1
  min_completion: 0.8
