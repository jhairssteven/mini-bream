# H0 lemniscate experiment overlay for BlueBoat Gazebo simulation (HAL topics).
# Algorithm params from mpc/experiments/results/lemniscate_validation/H0_baseline/config.yaml
#
# Prerequisites: blueboat_sim running (e.g. ros2 launch blueboat_sim open_water.launch.py)
# Run: ./run_real_boat.sh --platform sim

platform:
  name: blueboat_sim
  profile: sim
  prerequisites: blueboat_sim

sim_enable: true
use_sim_time: true

feedback:
  use_ground_truth_pose: true

origin:
  lat: 40.448417
  lon: -86.86775

topics:
  gps: /blueboat/sensors/gps/gps/fix
  imu: /blueboat/sensors/imu/imu/data
  odometry: /blueboat/sensors/position/ground_truth_odometry
  left_thrust: /blueboat/thrusters/left/thrust
  right_thrust: /blueboat/thrusters/right/thrust

# MPC publishes thrust directly to sim HAL; velocity odom not needed.
boat_bridge:
  velocity_odom_enabled: false

viz:
  pose_topic: /molo_mpc/vehicle_pose
  recent_poses_topic: /molo_h0/recent_poses
  frame_id: world
  max_recent_poses: 40

experiment:
  warmup_s: 5.0
  evaluate_s: 60.0
  skip_initial_s: 5.0
  target_rmse_m: 0.1
  wait_for_gps_timeout_s: 30.0
  wait_for_xte_timeout_s: 30.0
