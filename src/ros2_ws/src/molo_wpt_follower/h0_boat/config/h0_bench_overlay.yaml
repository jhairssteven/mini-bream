# Short bench run on the real boat: real GPS/IMU, thrust to sink topics (no motors).
# Applied on top of h0_boat_overlay.yaml via --platform bench or ./run_real_boat.sh --bench

platform:
  name: real_boat_bench
  profile: bench

topics:
  left_thrust: /molo_boat/thrust_left
  right_thrust: /molo_boat/thrust_right

experiment:
  warmup_s: 8.0
  evaluate_s: 15.0
  skip_initial_s: 8.0
  wait_for_gps_timeout_s: 60.0
  wait_for_xte_timeout_s: 20.0
