# Nav2 parameters for BlueBoat field operation (estimated odometry + LiDAR).

goal_path_planner:
  ros__parameters:
    planner_id: GridBased
    goal_topic: /goal_pose
    plan_topic: /plan
    replan_hz: 1.0

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: blueboat/blueboat/base_link
    min_height: 0.35
    max_height: 2.5
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.8
    range_max: 55.0
    use_inf: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 3.0
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: blueboat/blueboat/base_link
      use_sim_time: false
      rolling_window: true
      width: 60
      height: 60
      resolution: 0.25
      track_unknown_space: false
      transform_tolerance: 2.0
      footprint: "[[0.65, 0.33], [0.65, -0.33], [-0.65, -0.33], [-0.65, 0.33]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 10.0
          max_obstacle_height: 2.5
          min_obstacle_height: 0.0
          raytrace_max_range: 54.0
          raytrace_min_range: 0.0
          obstacle_max_range: 54.0
          obstacle_min_range: 0.8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

lifecycle_manager_planning:
  ros__parameters:
    autostart: true
    node_names: ["planner_server"]
