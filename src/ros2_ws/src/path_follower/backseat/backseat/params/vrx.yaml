/**:
  ros__parameters:
    sim_enable: True
    
    # Dubins
    dubins_radius: 0.1
    dubins_step_size: 0.5 # Max separation of each waypoint for the generated Dubins path
    replan_dist: 26.0
    no_of_laps: 1

    # Are these used?
    handover_offs: 1 # Meters before the end of the path to handover control of the vehicle
    
    # Linear speed limits
    max_linear_speed_pct: 0.1 # Use for heading controller (prefer low speeds for bigger heading errors)
    
    #origin_gps: [40.40229852, -86.84558228] # kepner
    #origin_gps: [40.448417, -86.867750]     # harner
    goal_lat          : 40.448417
    goal_lon          : -86.867750
    goal_head         : 1.5

    # Rotational PID gains
    kp : 1.0 # kp makes it faster
    kd : 0.2 # kd reduces overshoot
    ki : 0.0 # ki reduces settling error

    # ILOS
    replan_lookahead: 8.0  # Distance to look ahead to select next target waypoint when in need to replan. It is not replan_lookahead of ILOS.
    lookahead_min : 1.0
    lookahead_max : 3.0
    conv_rate     : 8.0
    gamma         : 0.0 # Integral gain


wtp_follower:
  ros__parameters:
    waypoint_achieved_offset_distance: 2.0
    kr            : 0.07  # 0.07
    ka            : 0.8   # 0.01
    kb            : 0.1   # 0.0
    max_linear_x  : 0.5   # 1.0
    max_angular_z : 0.2   # 0.2
