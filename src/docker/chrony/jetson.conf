# Mini-bream LAN time — Jetson.
#
# Follow the ground station. It has two addresses for the same clock:
#   192.168.0.104  bench Ethernet
#   192.168.0.103  field Wi-Fi (drops out when C2 leaves radio range)
# When neither answers, serve this host's clock at stratum 12 so the Pi can
# stay locked to the Jetson. Stratum 12 loses to C2 (internet stratum ~4, or
# local stratum 8 when C2 has no upstream), so a reachable ground station
# remains the time source.

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
keyfile /etc/chrony/chrony.keys
maxupdateskew 100.0
rtcsync
leapsectz right/UTC

# Step only during the first three updates after chronyd starts (boot or an
# explicit sync). Later corrections slew, so a ground station that reappears
# mid-mission cannot jump ROS time.
makestep 0.1 3

server 192.168.0.104 iburst minpoll 1 maxpoll 5 maxdelay 0.1
server 192.168.0.103 iburst minpoll 2 maxpoll 6 maxdelay 0.25

local stratum 12 distance 0.5
allow 192.168.0.0/24
