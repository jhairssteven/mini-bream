# Mini-bream LAN time — Pi.
#
# Prefer the Jetson over Ethernet. That link stays up when the ground station
# walks out of Wi-Fi range, and it is the pair whose stamps must agree
# (GPS/odom here, LiDAR on the Jetson). C2 is only a fallback if the Jetson
# is down.
#   192.168.0.104  C2 bench Ethernet
#   192.168.0.103  C2 field Wi-Fi

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
keyfile /etc/chrony/chrony.keys
maxupdateskew 100.0
rtcsync
leapsectz right/UTC

makestep 0.1 3

server 192.168.0.102 iburst prefer minpoll 0 maxpoll 4 maxdelay 0.05
server 192.168.0.104 iburst minpoll 2 maxpoll 6 maxdelay 0.1
server 192.168.0.103 iburst minpoll 2 maxpoll 6 maxdelay 0.25
