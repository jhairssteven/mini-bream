name: mini-bream-simulation

# BlueBoat in VRX open water (Gazebo Garden hydrodynamics + HAL topic bridges).
#   cd src/docker && ./mini_bream_env.sh start sim
#   ros2 topic echo /blueboat/sensors/gps/gps/fix

services:
  simulation:
    container_name: mini_bream_simulation
    image: mini-bream:simulation
    build:
      context: ../
      dockerfile: docker/Dockerfile.simulation
    network_mode: host
    init: true
    privileged: true
    environment:
      - TZ=${TZ:-}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GZ_VERSION=garden
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${LOCALTIME_PATH:-/etc/localtime}:/etc/localtime:ro
      - ../ros2_ws:/workspace/ros2_ws
      - ../vrx_ws:/workspace/vrx_ws
      - ../field_tests:/workspace/field_tests
      - ../docker:/workspace/docker:ro
      - ../docker/start_simulation.sh:/start_simulation.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    runtime: nvidia
    command: ["bash", "/start_simulation.sh"]
