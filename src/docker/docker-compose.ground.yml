name: mini-bream-ground

# Ground station RViz2 viewer (192.168.0.103). Subscribes to robot topics over DDS.
# Requires host networking + Cyclone DDS peers (see cyclonedds.xml).
#
# On the ground-station PC (with a display):
#   xhost +local:docker
#   docker compose -f docker-compose.ground.yml up --build
#
# Verify topics without RViz:
#   docker exec mini_bream_ground_station bash -lc \
#     'source /opt/ros/humble/setup.bash && ros2 topic list'

services:
  ground_station:
    container_name: mini_bream_ground_station
    image: mini-bream:ground-station
    build:
      context: ../
      dockerfile: docker/Dockerfile.ground_station
    network_mode: host
    init: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}  # must match Pi/Jetson (default 0)
      - GROUND_WIFI_IFACE=${GROUND_WIFI_IFACE:-wlp5s0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.ground.xml
      - RVIZ_CONFIG=${RVIZ_CONFIG:-/opt/ground_station/ground_station.rviz}
    volumes:
      - ../ros2_ws:/workspace/ros2_ws
      - ../docker/cyclonedds.ground.xml:/etc/cyclonedds.ground.xml:ro
      - ../docker/start_ground_station.sh:/start_ground_station.sh:ro
      - ../docker/config/ground_station.rviz:/opt/ground_station/ground_station.rviz:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    command: ["bash", "/start_ground_station.sh"]
