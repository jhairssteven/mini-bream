name: mini-bream-ground

# Ground station RViz2 viewer. Subscribes to robot topics over DDS.
#
# Heading comparison field test:
#   RVIZ_CONFIG=/workspace/docker/config/heading_compare.rviz \
#     docker compose -f docker-compose.ground.yml up ground_station
#
# On the ground-station PC (with a display):
#   xhost +local:docker
#   docker compose -f docker-compose.ground.yml up --build
#
# Verify topics without RViz:
#   docker exec mini_bream_ground_station bash -lc \
#     'source /opt/ros/humble/setup.bash && ros2 topic list'

services:
  ground_station:
    container_name: mini_bream_ground_station
    image: mini-bream:ground-station
    build:
      context: ../
      dockerfile: docker/Dockerfile.ground_station
    network_mode: host
    init: true
    environment:
      - TZ=${TZ:-}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}  # must match Pi/Jetson (default 0)
      - GROUND_IFACE=${GROUND_IFACE:-}
      - GROUND_DDS_ADDRESS=${GROUND_DDS_ADDRESS:-}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - RVIZ_CONFIG=${RVIZ_CONFIG:-/workspace/docker/config/molo_autonomy.rviz}
      - USE_SIM_TIME=${USE_SIM_TIME:-0}
    volumes:
      - ${LOCALTIME_PATH:-/etc/localtime}:/etc/localtime:ro
      - ../ros2_ws:/workspace/ros2_ws
      - ../field_tests:/workspace/field_tests
      - ../docker:/workspace/docker:ro
      - ../docker/config:/workspace/docker/config:rw
      - ../docker/record_rosbag.sh:/usr/local/bin/record_rosbag:ro
      - ../docker/cyclonedds.ground.xml:/etc/cyclonedds.ground.xml:ro
      - ../docker/start_ground_station.sh:/start_ground_station.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    command: ["bash", "/start_ground_station.sh"]
