name: mini-bream-frontseat

# Robot stack. Start with:
#   Pi:     docker compose -f docker-compose.frontseat.yml up -d pwm_daemon radio_rx
#           docker compose -f docker-compose.frontseat.yml up frontseat
#   Jetson: docker compose -f docker-compose.frontseat.yml up --build perception
#   ZED notes: ../ros2_ws/src/frontseat/config/zed2i/README.md
#
# Device profile: set DEVICE_CONFIG=rpi|jetson (see ../teleop/devices/)
# See ../teleop/README.md for roles, SiK port discovery, and data flow.
# LiDAR network: ../ros2_ws/src/frontseat/config/rslidar_airy/README.md

services:
  pwm_daemon:
    container_name: mini_bream_pwm_daemon
    image: mini-bream:teleop
    build:
      context: ../
      dockerfile: docker/Dockerfile.teleop
    network_mode: host
    init: true
    restart: unless-stopped
    privileged: true
    environment:
      - DEVICE_CONFIG=${DEVICE_CONFIG:-rpi}
      # Optional: force dry_run without editing the device JSON
      - PWM_BACKEND_OVERRIDE=${PWM_BACKEND_OVERRIDE:-}
      - PWM_DAEMON_HOST=127.0.0.1
      - PWM_DAEMON_PORT=5600
    volumes:
      - ../teleop:/opt/teleop
      - /dev:/dev
    command: >
      bash -c '
        EXTRA=""
        if [ -n "$$PWM_BACKEND_OVERRIDE" ]; then EXTRA="--backend $$PWM_BACKEND_OVERRIDE"; fi
        exec python3 /opt/teleop/pwm_daemon.py --device "$$DEVICE_CONFIG" $$EXTRA
      '
    # entrypoint.teleop.sh starts pigpiod before this command

  radio_rx:
    container_name: mini_bream_radio_rx
    image: mini-bream:teleop
    network_mode: host
    init: true
    restart: unless-stopped
    privileged: true
    depends_on:
      - pwm_daemon
    environment:
      # Prefer stable by-id path for SiK (FTDI FT231X). See README.
      - RADIO_SERIAL_PORT=${RADIO_SERIAL_PORT:-/dev/serial/by-id/usb-FTDI_FT231X_USB_UART_D30GKEF6-if00-port0}
      - RADIO_BAUD=${RADIO_BAUD:-57600}
      - PWM_DAEMON_HOST=127.0.0.1
      - PWM_DAEMON_PORT=5600
    volumes:
      - ../teleop:/opt/teleop
      - /dev:/dev
    command: >
      python3 /opt/teleop/radio_rx.py
        --port ${RADIO_SERIAL_PORT:-/dev/serial/by-id/usb-FTDI_FT231X_USB_UART_D30GKEF6-if00-port0}
        --baud ${RADIO_BAUD:-57600}

  frontseat:
    container_name: mini_bream_frontseat
    image: mini-bream:frontseat
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontseat
    network_mode: host
    init: true
    depends_on:
      - pwm_daemon
    privileged: true
    environment:
      - TELEOP_PATH=/opt/teleop
      - PWM_DAEMON_HOST=127.0.0.1
      - PWM_DAEMON_PORT=5600
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
    volumes:
      - ../ros2_ws:/workspace/ros2_ws
      - ../teleop:/opt/teleop
      - ../field_tests/rosbags:/workspace/field_tests/rosbags
      - ../docker:/workspace/docker:ro
      - ../docker/record_rosbag.sh:/usr/local/bin/record_rosbag:ro
      - ../docker/start_frontseat.sh:/start_frontseat.sh:ro
      - ../docker/cyclonedds.xml:/etc/cyclonedds.xml:ro
      - /dev:/dev
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    command: ["bash", "/start_frontseat.sh"]

  # Jetson: LiDAR + cameras (ZED 2i). No dependency on pwm/frontseat.
  perception:
    container_name: mini_bream_perception
    image: mini-bream:perception
    build:
      context: ../
      dockerfile: docker/Dockerfile.perception
      # Jetson Docker often has broken container DNS when daemon iptables=false.
      network: host
    runtime: nvidia
    network_mode: host
    ipc: host
    pid: host
    init: true
    restart: unless-stopped
    privileged: true
    environment:
      - LIDAR_IFACE=${LIDAR_IFACE:-eth0}
      - SETUP_AIRY_NETWORK=${SETUP_AIRY_NETWORK:-1}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.jetson.xml
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ../ros2_ws:/workspace/ros2_ws
      - ../field_tests/rosbags:/workspace/field_tests/rosbags
      - ../docker:/workspace/docker:ro
      - ../docker/record_rosbag.sh:/usr/local/bin/record_rosbag:ro
      - ../docker/start_perception.sh:/start_perception.sh:ro
      - ../docker/cyclonedds.jetson.xml:/etc/cyclonedds.jetson.xml:ro
      - ../ros2_ws/src/frontseat/config/zed2i/settings:/usr/local/zed/settings
      - ../ros2_ws/src/frontseat/config/zed2i/resources:/usr/local/zed/resources
      - /dev:/dev
      - /dev/shm:/dev/shm
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    command: ["bash", "/start_perception.sh"]
